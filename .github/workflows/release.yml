name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.2

    - name: Upload wheels as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: wheelhouse/*.whl

    - name: Attach wheels to release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" wheelhouse/*.whl
