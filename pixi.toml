# ------------------------------------------------------------------------------------------------ #
#                                              Config                                              #
# ------------------------------------------------------------------------------------------------ #

[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]


[pypi-options]
# Run the build in the current environment instead of creating an isolated one for it.
# This is needed because otherwise the build environment Python version will not match the
# target environment.
no-build-isolation = ["gambit"]


# ------------------------------------------------------------------------------------------------ #
#                                           Dependencies                                           #
# ------------------------------------------------------------------------------------------------ #

# ----------------------------------------- Environments ----------------------------------------- #

[environments]

# Default environment for developing - python 3.12 with editable install
default = { features=["pkg-editable", "py312", "build", "test", "dev"] }

# For testing with different python versions
# These do a standard non-editable install (because the Cython build is version-specific).
py39 = { features = ["py39", "pkg", "build", "test"] }
py310 = { features = ["py310", "pkg", "build", "test"] }
py311 = { features = ["py311", "pkg", "build", "test"] }
py312 = { features = ["py312", "pkg", "build", "test"] }
py313 = { features = ["py313", "pkg", "build", "test"] }

oldest = { features = ["py39", "oldest", "pkg", "build", "test"] }

# Standalone tool env for building/testing the bioconda recipe (conda-recipe/) against the
# local source tree. Not combined with the other features - conda-build manages its own
# isolated build/host envs internally.
condabuild = { features = ["condabuild"] }


# ------------------------------------------- Features ------------------------------------------- #

# Editable vs non-editable install of package
[feature.pkg.pypi-dependencies]
gambit = { path = "." }
[feature.pkg-editable.pypi-dependencies]
gambit = { path = "." , editable = true }

# Different minor Python versions
[feature.py39.dependencies]
python = "3.9.*"
[feature.py310.dependencies]
python = "3.10.*"
[feature.py311.dependencies]
python = "3.11.*"
[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"

# Building
# c-compiler provides the conda-forge gcc toolchain so the OpenMP (-fopenmp) build is reproducible
# rather than depending on the system compiler.
[feature.build.dependencies]
c-compiler = "*"
setuptools = "*"
wheel = "*"
python-build = "*"
cython = "3.*"

# Testing
[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

# Development
[feature.dev.dependencies]
ruff = "*"

# Tooling for building/testing the bioconda recipe (conda-recipe/) against local source.
[feature.condabuild.dependencies]
conda-build = "*"
conda-verify = "*"


# Oldest supported versions of libraries
[feature.oldest.dependencies]
numpy = "1.19.*"
sqlalchemy = "1.4.*"
biopython = "1.79.*"
attrs = "23.1.*"
cattrs = "23.2.*"
click = "8.0.*"
h5py = "3.1.*"
scipy = "1.7.*"
typing-extensions = "4.1.*"


# ------------------------------------------------------------------------------------------------ #
#                                               Tasks                                              #
# ------------------------------------------------------------------------------------------------ #

# Run pytest tests.
[feature.test.tasks]
test = "pytest"

# Run tests on all supported python versions.
[tasks.test-all]
depends-on = [
  { task = "test", environment = "py39" },
  { task = "test", environment = "py310" },
  { task = "test", environment = "py311" },
  { task = "test", environment = "py312" },
  { task = "test", environment = "py313" },
]

# Build a wheel for the current environment's Python version into dist/.
# --no-isolation uses this environment (matching Python version + conda toolchain) instead of
# creating a fresh isolated build env, consistent with no-build-isolation above.
[feature.build.tasks]
build-wheel = "python -m build --wheel --no-isolation"

# Build wheels for all supported Python versions into dist/.
# Each environment produces its own version-specific wheel (cp39, cp310, ...).
[tasks.build-all]
depends-on = [
  { task = "build-wheel", environment = "py39" },
  { task = "build-wheel", environment = "py310" },
  { task = "build-wheel", environment = "py311" },
  { task = "build-wheel", environment = "py312" },
  { task = "build-wheel", environment = "py313" },
]

# Remove build artifacts, including generated Cython C sources and compiled extensions
# (so the next build re-cythonizes and compiles from scratch).
[tasks.clean]
cmd = "rm -rf dist build src/gambit.egg-info src/gambit/_cython/*.c src/gambit/_cython/*.so"

# Build and test the bioconda recipe (conda-recipe/) against this working tree.
# conda-build copies the source directory verbatim, so clean first to avoid picking up stale
# compiled extensions/build artifacts from other environments.
# --croot: conda-build's default build root lives under the env prefix, which is inside this
# repo (.pixi/envs/...) - since our recipe's source is the repo itself, conda-build refuses to
# copy a directory into a subdirectory of itself. Point it outside the repo instead.
[feature.condabuild.tasks.conda-build-recipe]
cmd = [
  "conda", "build", "conda-recipe",
  "--override-channels -c conda-forge -c bioconda",
  "--python 3.12",
  "--croot /tmp/gambit-conda-bld",
]
depends-on = ["clean"]

# Development tasks.
[feature.dev.tasks]
lint = "ruff check"
format = "ruff format"
