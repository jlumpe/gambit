# ------------------------------------------------------------------------------------------------ #
#                                              Config                                              #
# ------------------------------------------------------------------------------------------------ #

[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]


[pypi-options]
# Run the build in the current environment instead of creating an isolated one for it.
# This is needed because otherwise the build environment Python version will not match the
# target environment.
no-build-isolation = ["gambit"]


# ------------------------------------------------------------------------------------------------ #
#                                           Dependencies                                           #
# ------------------------------------------------------------------------------------------------ #

# ----------------------------------------- Environments ----------------------------------------- #

[environments]

# Default environment for developing - python 3.14 with editable install
default = { features=["pkg-editable", "py314", "build", "test", "dev"] }

# For testing with different python versions
# These do a standard non-editable install (because the Cython build is version-specific).
py312 = { features = ["py312", "pkg", "build", "test"] }
py313 = { features = ["py313", "pkg", "build", "test"] }
py314 = { features = ["py314", "pkg", "build", "test"] }

oldest = { features = ["py312", "oldest", "pkg", "build", "test"] }

# Building and checking the sdist (no package install or compiler needed)
dist = { features = ["py312", "dist"] }


# ------------------------------------------- Features ------------------------------------------- #

# Editable vs non-editable install of package
[feature.pkg.pypi-dependencies]
gambit = { path = "." }
[feature.pkg-editable.pypi-dependencies]
gambit = { path = "." , editable = true }

# Different minor Python versions
[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

# Building
# c-compiler provides the conda-forge gcc toolchain so the OpenMP (-fopenmp) build is reproducible
# rather than depending on the system compiler.
[feature.build.dependencies]
c-compiler = "*"
setuptools = "*"
wheel = "*"
python-build = "*"
cython = "3.*"

# Building and checking distributions for upload
[feature.dist.dependencies]
setuptools = ">=77"
wheel = "*"
python-build = "*"
cython = "3.*"
twine = "*"

# Testing
[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-benchmark = "*"

# Development
[feature.dev.dependencies]
ruff = "*"
# Docs
sphinx = "*"
sphinx-rtd-theme = "*"

[feature.dev.pypi-dependencies]
# Docs
linuxdoc = "*"

# Oldest supported versions of libraries (lowest series with CPython 3.12 builds on conda-forge).
[feature.oldest.dependencies]
numpy = "1.26.*"
sqlalchemy = "1.4.*"
biopython = "1.81.*"
attrs = "23.1.*"
cattrs = "23.2.*"
click = "8.1.*"
h5py = "3.9.*"
scipy = "1.11.*"


# ------------------------------------------------------------------------------------------------ #
#                                               Tasks                                              #
# ------------------------------------------------------------------------------------------------ #

# Run pytest tests.
[feature.test.tasks]
test = "pytest"

# Run tests on all supported python versions.
[tasks.test-all]
depends-on = [
  { task = "test", environment = "py312" },
  { task = "test", environment = "py313" },
  { task = "test", environment = "py314" },
]

# Build a wheel for the current environment's Python version into dist/.
# --no-isolation uses this environment (matching Python version + conda toolchain) instead of
# creating a fresh isolated build env, consistent with no-build-isolation above.
[feature.build.tasks]
build-wheel = "python -m build --wheel --no-isolation"

# Build wheels for all supported Python versions as well as source distribution into dist/.
# Each environment produces its own version-specific wheel (cp312, cp313, ...).
[tasks.build-all]
depends-on = [
  { task = "build-wheel", environment = "py312" },
  { task = "build-wheel", environment = "py313" },
  { task = "build-wheel", environment = "py314" },
  { task = "build-sdist", environment = "dist" },
]

[feature.dist.tasks]
# Build the sdist into dist/
build-sdist = "python -m build --sdist --no-isolation"
# Check the metadata of everything in dist/ (as rendered on PyPI)
check-dist = "twine check --strict dist/*"

# Remove build artifacts, including generated Cython C sources and compiled extensions
# (so the next build re-cythonizes and compiles from scratch).
[tasks.clean]
cmd = "rm -rf dist build src/gambit.egg-info src/gambit/_cython/*.c src/gambit/_cython/*.so"

# Development tasks.
[feature.dev.tasks]
lint = "ruff check"
format = "ruff format"
docs = { cmd = "make html", cwd = "docs" }
docs-clean = { cmd = "make clean", cwd = "docs" }
docs-nitpicky = { cmd = "make SPHINXOPTS=-n html", cwd = "docs" }
