[build-system]
requires = [
    "setuptools >= 77",
    "wheel",
    "Cython >= 3.0",
]
build-backend = "setuptools.build_meta"


[project]
name = "gambit"
version = "1.2.0.post1"
description = "Genomic Approximation Method for Bacterial Identification and Tracking"
readme = "README.md"
authors = [
    { name = "Jared Lumpe", email = "jared@jaredlumpe.com" },
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

keywords = ["bioinformatics", "genomics", "taxonomy", "bacteria", "pathogen", "k-mer", "kmer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Cython",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Natural Language :: English",
]

requires-python = ">= 3.12"
dependencies = [
    # First series with CPython 3.12 builds.
    "numpy >= 1.26",
    # First 1.4 release with CPython 3.12 builds.
    "sqlalchemy >= 1.4.49",
    # Seq stores data as bytes. 1.81 is the first release with CPython 3.12 builds.
    "biopython ~= 1.81",
    "attrs >= 23.1",
    # Minimum for 3.12, also introduces potentially breaking changes
    "cattrs >= 23.2",
    # path_type=pathlib.Path support in click.Path requires >= 8.0.
    # 8.1 is the first series with CPython 3.12 builds.
    "click >= 8.1",
    # First series with CPython 3.12 builds.
    "h5py ~= 3.9",
    "scipy ~= 1.11",
]


[project.urls]
Homepage = "https://github.com/jlumpe/gambit"
Documentation = "https://gambit-genomics.readthedocs.io/en/latest"
Source = "https://github.com/jlumpe/gambit"
Issues = "https://github.com/jlumpe/gambit/issues"
Changelog = "https://github.com/jlumpe/gambit/blob/main/CHANGELOG.md"

[project.scripts]
gambit = "gambit.cli:cli"

[tool.setuptools]
# Incompatible with Cython extensions
zip-safe = false


# -------------------------------------------- Pytest -------------------------------------------- #

[tool.pytest.ini_options]
# Treat functions/classes prefixed with "benchmark" as tests, for files in tests/benchmarks/.
python_functions = ["test_*", "benchmark_*"]
python_classes = ["Test*", "Benchmark*"]


# --------------------------------------------- Ruff --------------------------------------------- #

[tool.ruff]
# line-length = 120
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
# Match previous flake8 defaults: pycodestyle (E/W) + pyflakes (F)
select = ["E", "W", "F"]
ignore = [
    # Indentation contains tabs - we use tabs intentionally
    "W191",
    # Indentation contains mixed spaces and tabs - spaces used for alignment
    "E101",
    # Blank line at end of file - a single trailing newline is required by .editorconfig,
    # but this rule is overly aggressive about what counts as a "blank line"
    "W391",
]

[tool.ruff.format]
indent-style = "tab"


# ----------------------------------------- cibuildwheel ----------------------------------------- #

[tool.cibuildwheel]
# CPython only, linux-64 (manylinux) only - matches supported versions/platforms in pixi.toml.
build = "cp312-* cp313-* cp314-*"
# musllinux, 32-bit, and PyPy are irrelevant here. cp313t/cp314t (free-threaded builds) are also
# skipped - the OpenMP/nogil Cython extensions haven't been verified under free-threading yet.
skip = "*-musllinux* *_i686 pp* cp31?t-*"

# h5py (and other deps) only publish wheels tagged manylinux_2_28+; the default manylinux2014
# image's older glibc can't install those, forcing a source build that fails due to missing/old
# system HDF5.
manylinux-x86_64-image = "manylinux_2_28"

test-requires = "pytest"
test-command = "pytest {project}/tests"
